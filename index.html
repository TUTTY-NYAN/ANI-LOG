<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0c1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anime Log">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Track the anime you watch. Saves on your device.">
<title>Anime Log</title>
<style>
  /* ============================================================
     RESET
     ============================================================ */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);

    --bg-1: #0f0c1f;
    --bg-2: #1a1630;
    --surface: rgba(22, 19, 40, 0.85);
    --border: rgba(180, 140, 255, 0.25);
    --border-soft: #302950;
    --border-input: #342e4e;
    --text: #f0ecff;
    --text-muted: #a99bc9;
    --text-dim: #6b5f8a;
    --accent: #8b6eff;
    --accent-2: #6a4cdb;
    --accent-glow: rgba(155, 123, 255, 0.2);
    --success-bg: #1e3b2e;
    --success-border: #367a4b;
    --success-text: #b1f0c1;
    --danger-bg: #522b3a;
    --danger-border: #b85b7a;
    --danger-text: #ffb0c0;
    --radius-sm: 0.7rem;
    --radius: 1rem;
    --radius-lg: 1.5rem;
    --radius-xl: 2rem;
    --tap-min: 44px;
  }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    scroll-behavior: smooth;
  }

  html, body { height: 100%; overflow-x: hidden; }

  body {
    background:
      radial-gradient(circle at 20% 0%, rgba(139, 110, 255, 0.15), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(107, 76, 219, 0.12), transparent 40%),
      linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    background-repeat: no-repeat;
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* ============================================================
     LAYOUT
     ============================================================ */
  .page {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    min-height: 100dvh;
    padding:
      calc(0.75rem + var(--safe-top))
      calc(0.75rem + var(--safe-right))
      calc(1rem + var(--safe-bottom))
      calc(0.75rem + var(--safe-left));
  }

  .app-card {
    width: 100%;
    max-width: 780px;
    background: var(--surface);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    box-shadow:
      0 24px 48px rgba(0, 0, 0, 0.55),
      0 0 0 1px rgba(200, 160, 255, 0.08) inset;
    animation: cardIn 0.35s ease both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ============================================================
     HEADER
     ============================================================ */
  .header { margin-bottom: 1.5rem; }

  h1 {
    font-size: clamp(1.35rem, 5vw, 2rem);
    font-weight: 700;
    color: #ede9ff;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    line-height: 1.15;
    letter-spacing: -0.02em;
    text-shadow: 0 2px 12px rgba(160, 120, 255, 0.55);
  }

  h1 .logo { font-size: 1.15em; flex-shrink: 0; }

  .subhead {
    color: var(--text-muted);
    font-size: clamp(0.78rem, 2.8vw, 0.9rem);
    margin-top: 0.4rem;
    padding-left: 0.75rem;
    border-left: 3px solid var(--accent);
    line-height: 1.4;
  }

  /* ============================================================
     FORM
     ============================================================ */
  .add-form {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.7rem;
    margin-bottom: 1.5rem;
  }

  .form-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.7rem;
  }

  .form-fields .field-title { grid-column: 1 / -1; }

  .field {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .field label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 700;
    color: #b7a9e0;
    margin-bottom: 0.35rem;
    padding-left: 0.35rem;
  }

  .field input {
    background: rgba(12, 10, 24, 0.85);
    border: 1.5px solid var(--border-input);
    border-radius: var(--radius-sm);
    padding: 0.8rem 0.95rem;
    font-size: 16px; /* prevents iOS zoom */
    color: var(--text);
    font-family: inherit;
    width: 100%;
    min-height: 48px;
    outline: none;
    transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }

  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow);
    background: #1c1733;
  }

  .field input::placeholder { color: var(--text-dim); }

  /* Remove spinners on number inputs */
  .field input[type="number"]::-webkit-outer-spin-button,
  .field input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .field input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

  .add-btn {
    background: linear-gradient(145deg, var(--accent), var(--accent-2));
    border: none;
    border-radius: var(--radius-sm);
    padding: 0.95rem 1.25rem;
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    font-family: inherit;
    cursor: pointer;
    min-height: 52px;
    box-shadow: 0 8px 20px -8px #4a2f9e, 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
    transition: transform 0.12s ease, box-shadow 0.18s ease, filter 0.18s ease;
    touch-action: manipulation;
    letter-spacing: 0.2px;
  }

  .add-btn:active {
    transform: scale(0.98);
    box-shadow: 0 4px 12px -6px #4a2f9e;
  }

  .add-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ============================================================
     TOOLBAR (stats + filters)
     ============================================================ */
  .toolbar {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.8rem;
    margin-bottom: 1.2rem;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.4rem;
    background: rgba(0, 0, 0, 0.3);
    padding: 0.55rem;
    border-radius: var(--radius);
    border: 1px solid #332b4b;
    font-size: 0.82rem;
    color: #cbbef0;
    font-weight: 500;
  }

  .stat-item {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
    white-space: nowrap;
    padding: 0.2rem 0.3rem;
    min-width: 0;
  }

  .stat-label { overflow: hidden; text-overflow: ellipsis; }

  .stat-value {
    color: #fff;
    font-weight: 700;
    background: #382f58;
    padding: 0.12rem 0.55rem;
    border-radius: 1rem;
    font-size: 0.78rem;
    min-width: 1.6rem;
    text-align: center;
    flex-shrink: 0;
  }

  .filter-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.4rem;
  }

  .filter-btn {
    background: transparent;
    border: 1.5px solid #3e355c;
    color: #b7a9e0;
    padding: 0.65rem 0.5rem;
    border-radius: 2rem;
    font-size: clamp(0.72rem, 2.6vw, 0.85rem);
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    min-height: var(--tap-min);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: all 0.15s ease;
    touch-action: manipulation;
  }

  .filter-btn.active {
    background: linear-gradient(145deg, var(--accent-2), #5a3ec8);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 14px #6a4cdb88;
  }

  .filter-btn:active:not(.active) { background: #2e2748; }

  .filter-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ============================================================
     ANIME LIST
     ============================================================ */
  .anime-list {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.7rem;
  }

  .anime-item {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 0.75rem;
    background: linear-gradient(105deg, #211c36, #1b162e);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 0.85rem 0.95rem;
    animation: fadeSlide 0.22s ease both;
    transition: border-color 0.15s ease, background 0.15s ease;
    min-width: 0;
  }

  .anime-item:active { border-color: #5f4b91; }

  .anime-item.watched { opacity: 0.68; border-color: #2a4b3a; }

  .anime-info {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    min-width: 0;
    overflow: hidden;
  }

  .anime-title {
    font-size: clamp(0.9rem, 3.4vw, 1rem);
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  .anime-item.watched .anime-title {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  .anime-meta {
    display: flex;
    gap: 0.35rem;
    flex-wrap: wrap;
    font-size: 0.72rem;
  }

  .anime-meta i {
    font-style: normal;
    background: #2e2649;
    padding: 0.18rem 0.6rem;
    border-radius: 1rem;
    color: #cbb6ff;
    font-weight: 600;
    white-space: nowrap;
  }

  .actions {
    display: flex;
    gap: 0.4rem;
    flex-shrink: 0;
  }

  .icon-btn {
    background: #292143;
    border: 1px solid #413763;
    color: #cebfff;
    width: var(--tap-min);
    height: var(--tap-min);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    line-height: 1;
    font-family: inherit;
    cursor: pointer;
    padding: 0;
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
    touch-action: manipulation;
  }

  .icon-btn:active { transform: scale(0.9); background: #3d2f66; }

  .icon-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .icon-btn.done-btn {
    background: var(--success-bg);
    border-color: var(--success-border);
    color: var(--success-text);
  }

  .icon-btn.undo-btn {
    background: #3f2b47;
    border-color: #7e5b8b;
    color: #e6b3ff;
  }

  .icon-btn.delete-btn:active {
    background: var(--danger-bg);
    border-color: var(--danger-border);
    color: var(--danger-text);
  }

  /* ============================================================
     EMPTY STATE
     ============================================================ */
  .empty {
    text-align: center;
    padding: 2.5rem 1rem;
    color: #8d7fb0;
    background: #18122b;
    border-radius: var(--radius);
    border: 1px dashed #3b3157;
    font-size: 0.95rem;
  }

  .empty .empty-icon {
    font-size: 2.5rem;
    display: block;
    margin-bottom: 0.5rem;
    opacity: 0.7;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Reduce motion for accessibility */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* ============================================================
     RESPONSIVE BREAKPOINTS
     ============================================================ */

  /* Tiny phones (iPhone SE, older Androids) — keep things compact */
  @media (max-width: 340px) {
    .app-card { padding: 1rem 0.85rem; border-radius: 1.1rem; }
    .form-fields { grid-template-columns: 1fr; }
    .stats { font-size: 0.75rem; }
    .stat-item { gap: 0.2rem; }
    .anime-item { padding: 0.75rem 0.8rem; }
    .anime-meta { font-size: 0.68rem; }
    .icon-btn { width: 40px; height: 40px; font-size: 1rem; }
    .filter-btn { padding: 0.55rem 0.4rem; }
  }

  /* Small tablets and large phones, landscape phones */
  @media (min-width: 560px) {
    .page { padding: 1.25rem; padding-top: calc(1.25rem + var(--safe-top)); }
    .app-card { padding: 1.75rem; border-radius: var(--radius-xl); }

    .add-form {
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 0.6rem;
    }
    .form-fields {
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 0.6rem;
    }
    .form-fields .field-title { grid-column: auto; }
    .add-btn { padding: 0.95rem 1.75rem; align-self: end; }

    .toolbar {
      grid-template-columns: 1fr auto;
      align-items: center;
    }
    .stats { grid-template-columns: repeat(3, auto); }
    .filter-buttons { grid-template-columns: repeat(3, auto); }
    .filter-btn { padding: 0.65rem 1.15rem; }
  }

  /* Tablets */
  @media (min-width: 760px) {
    .app-card { padding: 2rem; max-width: 820px; }
    .anime-item { padding: 1rem 1.15rem; gap: 1rem; }
    .actions { gap: 0.5rem; }
    .icon-btn { width: 42px; height: 42px; font-size: 1.15rem; }
  }

  /* Larger desktops */
  @media (min-width: 1024px) {
    .app-card { max-width: 880px; padding: 2.25rem 2.25rem; }
    .page { padding-top: calc(2rem + var(--safe-top)); }
  }

  /* Wide screens — optional two-column anime list on very large displays */
  @media (min-width: 1400px) {
    .app-card { max-width: 1080px; }
    .anime-list { grid-template-columns: 1fr 1fr; }
  }

  /* Landscape phones — reduce vertical padding, avoid overflow */
  @media (max-height: 500px) and (orientation: landscape) {
    .page { padding: 0.75rem; padding-top: calc(0.75rem + var(--safe-top)); }
    .app-card { padding: 1rem 1.25rem; }
    .subhead { margin-bottom: 1rem; }
    .add-form { margin-bottom: 1rem; }
  }

  /* Hover only on devices that actually support it */
  @media (hover: hover) and (pointer: fine) {
    .add-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .icon-btn:hover { background: #3d2f66; border-color: #8870d4; transform: scale(1.06); }
    .icon-btn.done-btn:hover { background: #2b5c40; }
    .filter-btn:hover:not(.active) { background: #2e2748; }
    .anime-item:hover { border-color: #5f4b91; background: linear-gradient(105deg, #26203f, #1f1936); }
  }

  /* High-contrast / forced-colors fallback */
  @media (prefers-contrast: more) {
    .app-card { background: #14102a; border-color: #a78bfa; }
    .anime-item { border-color: #4a3f7a; }
    .field input { border-color: #5b4f8a; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="app-card">

      <!-- Header -->
      <header class="header">
        <h1><span class="logo">📺</span> Anime Log</h1>
        <div class="subhead">Track what you watch · saved on your device</div>
      </header>

      <!-- Add form -->
      <form class="add-form" id="addForm" novalidate>
        <div class="form-fields">
          <div class="field field-title">
            <label for="title">Title</label>
            <input id="title" type="text" placeholder="e.g. Frieren" autocomplete="off" enterkeyhint="next" required>
          </div>
          <div class="field">
            <label for="episodes">Episodes</label>
            <input id="episodes" type="number" inputmode="numeric" min="0" placeholder="28" autocomplete="off" enterkeyhint="next">
          </div>
          <div class="field">
            <label for="seasons">Seasons</label>
            <input id="seasons" type="number" inputmode="numeric" min="0" placeholder="2" autocomplete="off" enterkeyhint="done">
          </div>
        </div>
        <button class="add-btn" type="submit">+ Add Anime</button>
      </form>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="stats" role="status" aria-live="polite">
          <div class="stat-item">
            <span class="stat-label">📋 All</span>
            <span class="stat-value" id="statTotal">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">✅ Done</span>
            <span class="stat-value" id="statDone">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">⏳ Left</span>
            <span class="stat-value" id="statLeft">0</span>
          </div>
        </div>

        <div class="filter-buttons" role="tablist" aria-label="Filter anime list">
          <button class="filter-btn active" data-filter="all" type="button" role="tab" aria-selected="true">All</button>
          <button class="filter-btn" data-filter="pending" type="button" role="tab" aria-selected="false">To watch</button>
          <button class="filter-btn" data-filter="done" type="button" role="tab" aria-selected="false">Done</button>
        </div>
      </div>

      <!-- List -->
      <div class="anime-list" id="list" role="list"></div>
    </div>
  </div>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'anime_log_simple';

  let animes = load();
  let filter = 'all';

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length) return parsed;
      }
    } catch {}
    return [
      { id: uid(), title: 'Demon Slayer',    episodes: 26, seasons: 3, watched: false },
      { id: uid(), title: 'Jujutsu Kaisen',  episodes: 24, seasons: 2, watched: true  },
      { id: uid(), title: 'Attack on Titan', episodes: 87, seasons: 4, watched: false },
      { id: uid(), title: 'Spy x Family',    episodes: 25, seasons: 2, watched: true  },
      { id: uid(), title: 'Frieren',         episodes: 28, seasons: 1, watched: false }
    ];
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(animes)); } catch {}
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // --- DOM refs ---
  const $list     = document.getElementById('list');
  const $form     = document.getElementById('addForm');
  const $title    = document.getElementById('title');
  const $episodes = document.getElementById('episodes');
  const $seasons  = document.getElementById('seasons');
  const $total    = document.getElementById('statTotal');
  const $done     = document.getElementById('statDone');
  const $left     = document.getElementById('statLeft');
  const $filters  = document.querySelectorAll('.filter-btn');

  // --- Render ---
  function render() {
    renderStats();
    renderList();
  }

  function renderStats() {
    const total = animes.length;
    const done  = animes.filter(a => a.watched).length;
    $total.textContent = total;
    $done.textContent  = done;
    $left.textContent  = total - done;
  }

  function renderList() {
    const visible = animes.filter(a => {
      if (filter === 'pending') return !a.watched;
      if (filter === 'done')    return  a.watched;
      return true;
    });

    $list.innerHTML = '';

    if (!visible.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = `
        <span class="empty-icon">🍿</span>
        ${animes.length ? 'Nothing in this filter.' : 'No anime yet — add one above!'}
      `;
      $list.appendChild(empty);
      return;
    }

    visible.forEach(anime => {
      const item = document.createElement('div');
      item.className = 'anime-item' + (anime.watched ? ' watched' : '');
      item.setAttribute('role', 'listitem');

      // Build meta safely
      const metaParts = [];
      if (anime.episodes != null) {
        const ep = document.createElement('i');
        ep.textContent = `📀 ${anime.episodes} eps`;
        metaParts.push(ep);
      }
      if (anime.seasons != null) {
        const sn = document.createElement('i');
        sn.textContent = `📺 ${anime.seasons} seasons`;
        metaParts.push(sn);
      }

      const info = document.createElement('div');
      info.className = 'anime-info';

      const titleEl = document.createElement('div');
      titleEl.className = 'anime-title';
      titleEl.textContent = anime.title;

      const metaEl = document.createElement('div');
      metaEl.className = 'anime-meta';
      metaParts.forEach(el => metaEl.appendChild(el));

      info.appendChild(titleEl);
      info.appendChild(metaEl);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const toggleBtn = document.createElement('button');
      toggleBtn.type = 'button';
      toggleBtn.className = 'icon-btn ' + (anime.watched ? 'undo-btn' : 'done-btn');
      toggleBtn.textContent = anime.watched ? '↩' : '✓';
      toggleBtn.setAttribute('aria-label',
        anime.watched ? `Mark ${anime.title} as not watched` : `Mark ${anime.title} as watched`);
      toggleBtn.addEventListener('click', () => {
        anime.watched = !anime.watched;
        save();
        render();
      });

      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'icon-btn delete-btn';
      deleteBtn.textContent = '🗑';
      deleteBtn.setAttribute('aria-label', `Delete ${anime.title}`);
      deleteBtn.addEventListener('click', () => {
        animes = animes.filter(a => a.id !== anime.id);
        save();
        render();
      });

      actions.appendChild(toggleBtn);
      actions.appendChild(deleteBtn);

      item.appendChild(info);
      item.appendChild(actions);
      $list.appendChild(item);
    });
  }

  // --- Add ---
  $form.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = $title.value.trim();
    if (!title) {
      $title.focus();
      return;
    }

    animes.unshift({
      id: uid(),
      title,
      episodes: $episodes.value !== '' ? Number($episodes.value) : null,
      seasons:  $seasons.value  !== '' ? Number($seasons.value)  : null,
      watched: false
    });

    save();
    $form.reset();
    $title.focus();

    if (filter === 'done') setFilter('all');
    render();
  });

  // --- Filters ---
  function setFilter(next) {
    filter = next;
    $filters.forEach(b => {
      const isActive = b.dataset.filter === next;
      b.classList.toggle('active', isActive);
      b.setAttribute('aria-selected', isActive ? 'true' : 'false');
    });
    renderList();
  }

  $filters.forEach(btn => {
    btn.addEventListener('click', () => setFilter(btn.dataset.filter));
  });

  // --- Init ---
  save();
  render();
})();
</script>
</body>
</html>
